name: CI

on:
  push:
    branches: [ "master", "develop" ]
  pull_request:
    branches: [ "master", "develop" ]

permissions:
  contents: read

env:
  NEXT_PUBLIC_SITE_URL: "http://localhost:3001"
  NEXT_PUBLIC_DASHBOARD_URL: "http://localhost:3002"
  NEXT_PUBLIC_SUPABASE_URL: "https://example.supabase.co"
  NEXT_PUBLIC_SUPABASE_ANON_KEY: "test-anon-key"
  SUPABASE_SERVICE_ROLE_KEY: "test-service-role-key"
  UPSTASH_REDIS_REST_URL: "https://example.upstash.io"
  UPSTASH_REDIS_REST_TOKEN: "test-upstash-token"
  RESEND_API_KEY: "test-resend-key"
  RESEND_FROM_EMAIL: "no-reply@example.com"
  RESEND_SECURITY_FROM_EMAIL: "security@example.com"
  OTP_PEPPER: "test-otp-pepper-1234567890"
  AUTH_SMS_PROVIDER: "mock"
  AUTH_MOCK_SMS_CODE: "123456"
  AUTH_DISABLE_RATE_LIMITS: "true"

jobs:
  quality-checks:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Type Check
        run: pnpm run type-check

  auth-tests:
    name: Auth Unit, API & E2E Tests
    runs-on: ubuntu-latest
    needs: quality-checks

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        run: pnpm --filter auth exec playwright install --with-deps chromium

      - name: Run All Auth Unit Tests
        run: pnpm --filter auth run test:unit

      - name: Run Auth API Tests
        run: pnpm --filter auth test:api

      - name: Run Auth E2E Tests
        run: pnpm --filter auth test:e2e

      - name: Upload Playwright Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-playwright-artifacts
          path: |
            apps/auth/playwright-report
            apps/auth/test-results
          if-no-files-found: ignore

  auth-database-contract:
    name: Auth Database Contract
    runs-on: ubuntu-latest
    needs: quality-checks

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Supabase CLI version
        working-directory: apps/auth
        run: pnpm exec supabase --version

      - name: Start local Supabase
        working-directory: apps/auth
        run: pnpm exec supabase start

      - name: Replay migrations from an empty database
        working-directory: apps/auth
        run: pnpm exec supabase db reset --yes

      - name: Run database contract tests
        working-directory: apps/auth
        run: pnpm exec supabase test db

      - name: Verify local GoTrue Admin email migration contract
        working-directory: apps/auth
        run: pnpm run test:auth-migration-contract

      - name: Stop local Supabase
        if: always()
        working-directory: apps/auth
        run: pnpm exec supabase stop --no-backup

  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs:
      - quality-checks
      - auth-tests
      - auth-database-contract

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build
